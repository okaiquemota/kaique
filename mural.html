<body>

<div class="shell shell--topo">
  <header class="top">
    <a class="who" href="./">Kaique <span class="b">Mota</span></a>
    <span class="lockup">
      <a class="sticker" href="jogos.html">Passatempo</a>
      <a class="sticker" href="https://www.instagram.com/kiq.ham/" target="_blank" rel="noopener">@kiq.ham</a>
    </span>
  </header>
</div>

<main>
<section class="mural" id="mural">

  <header class="play-top">
    <h1 class="play-title">Mu<span class="b">ral</span></h1>
    <span class="play-sub">cola um recado aí</span>
  </header>

  <form class="compor" id="compor" autocomplete="off">
    <label class="vis-oculto" for="m-texto">Recado</label>
    <textarea id="m-texto" name="texto" rows="4" maxlength="180"
              placeholder="escreve aqui…" required></textarea>
    <div class="compor-pe">
      <label class="vis-oculto" for="m-nome">Seu nome</label>
      <input id="m-nome" name="nome" maxlength="24" placeholder="seu nome (opcional)">
      <span class="conta" id="m-conta" aria-hidden="true">180</span>
    </div>
    <button class="btn btn--peq" type="submit">Colar</button>
  </form>

  <div class="notas" id="notas"></div>
  <p class="vazio" id="m-vazio">Nada colado ainda. Começa você.</p>

</section>
</main>

<script src="js/kiq.js?v=7"></script>
<script src="js/mural.js?v=7"></script>

</body>
