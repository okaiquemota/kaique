<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Portf&oacute;lio de Kaique Mota &mdash; desenvolvedor e criativo.">
  <title>Kaique Mota &mdash; Portf&oacute;lio</title>

  <!-- Playfair Display (nome) + Caveat (manuscrito do Mural).
       Se quiser voltar a zero dependencias externas, remova estas 3 linhas:
       o CSS ja cai para Georgia/cursive do sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Caveat:wght@500;600&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       O VACUO  (tudo aqui e decorativo e nao clicavel)
       ============================================================ -->
  <div class="cosmos" aria-hidden="true">
    <div class="ceu ceu--longe"></div>
    <div class="ceu ceu--meio"></div>
    <div class="ceu ceu--perto"></div>

    <div class="aro aro--um"></div>
    <div class="aro aro--dois"></div>
    <div class="aro aro--tres"></div>

    <!-- Satelites: tralha pessoal boiando em gravidade zero.
         O emoji e so o ocupante do lugar. Para plugar seu PNG
         transparente, ponha um <img> dentro do span (o CSS ja
         dimensiona: .satelite img { width:100%; height:100% }). -->
    <span class="satelite sat--filme" data-satelite="filme">&#127902;&#65039;</span>
    <!-- trocar por PNG: <span class="satelite sat--filme" data-satelite="filme"><img src="img/filme.png" alt=""></span> -->
    <span class="satelite sat--clipe" data-satelite="clipe">&#128206;</span>
    <!-- trocar por PNG: <span class="satelite sat--clipe" data-satelite="clipe"><img src="img/clipe.png" alt=""></span> -->
    <span class="satelite sat--tampa" data-satelite="tampa-lente"><svg viewBox="0 0 32 32" focusable="false" aria-hidden="true">
        <defs>
          <linearGradient id="tp-corpo" x1=".2" y1="0" x2=".8" y2="1">
            <stop offset="0" stop-color="#3f4653"/>
            <stop offset=".45" stop-color="#1c212b"/>
            <stop offset="1" stop-color="#0c0f15"/>
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="15" fill="url(#tp-corpo)" stroke="rgba(255,255,255,.18)"/>
        <circle cx="16" cy="16" r="10.5" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1.2"/>
        <rect x="2.6" y="13.4" width="5.2" height="5.2" rx="1.6" fill="rgba(255,255,255,.14)"/>
        <rect x="24.2" y="13.4" width="5.2" height="5.2" rx="1.6" fill="rgba(255,255,255,.14)"/>
        <path d="M8.5 8.5 A10.5 10.5 0 0 1 16 5.5" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.4" stroke-linecap="round"/>
      </svg></span>
    <!-- trocar por PNG: <span class="satelite sat--tampa" data-satelite="tampa-lente"><img src="img/tampa-lente.png" alt=""></span> -->
    <span class="satelite sat--cafe" data-satelite="cafe">&#9749;</span>
    <!-- trocar por PNG: <span class="satelite sat--cafe" data-satelite="cafe"><img src="img/cafe.png" alt=""></span> -->
    <span class="satelite sat--usb" data-satelite="usb">&#128268;</span>
    <!-- trocar por PNG: <span class="satelite sat--usb" data-satelite="usb"><img src="img/usb.png" alt=""></span> -->
    <span class="satelite sat--clipe2 satelite--longe" data-satelite="clipe">&#128206;</span>
    <!-- trocar por PNG: <span class="satelite sat--clipe2 satelite--longe" data-satelite="clipe"><img src="img/clipe.png" alt=""></span> -->
    <span class="satelite sat--carro" data-satelite="carro-208"><svg viewBox="0 0 60 34" focusable="false" aria-hidden="true">
        <defs>
          <linearGradient id="ca-pintura" x1=".25" y1="0" x2=".4" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".32" stop-color="#f5f7fa"/>
            <stop offset=".6" stop-color="#dde3ec"/>
            <stop offset=".85" stop-color="#b0b9c8"/>
            <stop offset="1" stop-color="#8a94a4"/>
          </linearGradient>
          <linearGradient id="ca-vidro" x1=".1" y1="0" x2=".5" y2="1">
            <stop offset="0" stop-color="#61748c"/>
            <stop offset="1" stop-color="#19222e"/>
          </linearGradient>
        </defs>

        <!-- Hatch curto: balancos apertados, tampa traseira quase em pe
             e caixas de roda recortadas em arco de verdade. -->
        <path fill="url(#ca-pintura)" d="M4.6 25.8 L4.6 21.4 Q4.8 17.2 8.4 16.2 L16.6 15.2
                 Q18.6 9.2 25.4 7.9 L41.6 7.6 Q43.6 7.7 44.4 8.8
                 Q48.4 11.8 51.2 15.5 L53.8 17.5 Q55.6 18.7 55.6 21.6 L55.6 25.8
                 L53.6 25.8 a 6.4 6.4 0 0 0 -12.8 0 L19.4 25.8 a 6.4 6.4 0 0 0 -12.8 0 Z"/>

        <!-- sombra na saia: lataria branca precisa disso para ter volume -->
        <path fill="rgba(58,68,84,.3)" d="M4.6 23.4 L55.6 23.4 L55.6 25.8 L53.6 25.8
                 a 6.4 6.4 0 0 0 -12.8 0 L19.4 25.8 a 6.4 6.4 0 0 0 -12.8 0 Z"/>

        <!-- vidros -->
        <path fill="url(#ca-vidro)" d="M19.2 14.6 Q21 10.2 26 9.1 L32.4 9 L32.4 14.5 Z"/>
        <path fill="url(#ca-vidro)" d="M34 9 L41.2 8.8 Q45.6 10.6 48.6 14.1 L34 14.5 Z"/>

        <!-- coluna B, linha da porta, macaneta -->
        <path d="M33.2 9 L33.2 14.6" stroke="rgba(150,160,176,.9)" stroke-width="1.1" fill="none"/>
        <path d="M33 15.4 L33 24" stroke="rgba(150,160,176,.5)" stroke-width=".7" fill="none"/>
        <rect x="28.6" y="17.2" width="3.4" height="1.3" rx=".65" fill="rgba(118,130,148,.8)"/>

        <!-- vinco lateral -->
        <path d="M7.8 19.2 Q30 18 54.4 19.6" stroke="rgba(255,255,255,.5)" stroke-width=".7" fill="none"/>

        <!-- farol e a lanterna em garra -->
        <path d="M4.9 17.4 L10.8 16.7 L10.8 19.2 L4.9 19.6 Z" fill="#eef4ff"/>
        <path d="M5.2 17.9 L9.8 17.3" stroke="rgba(120,180,255,.9)" stroke-width=".8"/>
        <path d="M55.5 17.6 L51.6 18.4 Q51 20.2 51.6 21.8 L55.5 21.4 Z" fill="#cf3a31"/>
        <path d="M53.9 18.5 Q53.3 20 53.9 21.5" stroke="rgba(255,190,180,.75)" stroke-width=".6" fill="none"/>

        <!-- retrovisor -->
        <path d="M18 14.8 L15.8 15.1 L16 16.5 L18.2 16.2 Z" fill="#c9d2de"/>

        <!-- rodas com liga de 5 raios -->
        <g>
          <circle cx="13" cy="25.8" r="5.5" fill="#0f1319"/>
          <circle cx="13" cy="25.8" r="3.05" fill="#c6cfdc"/>
          <g stroke="#8d97a6" stroke-width=".55" stroke-linecap="round"><path d="M13.00 24.80 L13.00 23.00"/><path d="M13.95 25.49 L15.66 24.93"/><path d="M13.59 26.61 L14.65 28.07"/><path d="M12.41 26.61 L11.35 28.07"/><path d="M12.05 25.49 L10.34 24.93"/></g>
          <circle cx="13" cy="25.8" r="1.05" fill="#5b6572"/>
          <circle cx="47.2" cy="25.8" r="5.5" fill="#0f1319"/>
          <circle cx="47.2" cy="25.8" r="3.05" fill="#c6cfdc"/>
          <g stroke="#8d97a6" stroke-width=".55" stroke-linecap="round"><path d="M47.20 24.80 L47.20 23.00"/><path d="M48.15 25.49 L49.86 24.93"/><path d="M47.79 26.61 L48.85 28.07"/><path d="M46.61 26.61 L45.55 28.07"/><path d="M46.25 25.49 L44.54 24.93"/></g>
          <circle cx="47.2" cy="25.8" r="1.05" fill="#5b6572"/>
        </g>

        <!-- reflexo do vacuo na lataria -->
        <path d="M18.4 15.4 Q32 12.6 48.8 15.1" stroke="rgba(255,255,255,.8)" stroke-width=".8" fill="none" stroke-linecap="round"/>
      </svg></span>
    <!-- trocar por PNG: <span class="satelite sat--carro" data-satelite="carro-208"><img src="img/carro-208.png" alt=""></span> -->

    <div class="vinheta"></div>
  </div>

  <!-- ============================================================
       ESPACO PRINCIPAL
       ============================================================ -->
  <main class="espaco">

    <!-- ---------- O CENTRO ---------- -->
    <div class="nucleo">
      <h1 class="nome">KiQ</h1>
    </div>

    <!-- ---------- A ORBITA ---------- -->
    <nav class="orbita" aria-label="Links do portf&oacute;lio">
      <!-- 1. GitHub &middot; 7s &middot; octocat dourado sobre placa de circuito -->
      <a class="orbe orbe--nu orbe--github" href="https://github.com/okaiquemota" target="_blank" rel="noopener noreferrer"
         draggable="false" aria-label="GitHub" title="GitHub &middot; dois cliques para abrir">
        <span class="orbe__flutua">
        <span class="orbe__face">
          <span class="orbe__icone" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false" aria-hidden="true">
              <defs>
                <linearGradient id="gh-corpo" x1="0" y1="0" x2=".32" y2="1">
                  <stop offset="0" stop-color="#2b3138"/>
                  <stop offset="1" stop-color="#0d1117"/>
                </linearGradient>
              </defs>
              <rect x="1" y="1" width="46" height="46" rx="11" fill="url(#gh-corpo)" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
              <g transform="translate(24,24) scale(1.3) translate(-12,-12)">
                <path fill="#ffffff" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23a11.5 11.5 0 0 1 3-.405c1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
              </g>
              <path d="M11 5.2 Q24 2.2 37 5.2" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
        </span>
        </span>
      </a>
      <!-- 2. Instagram &middot; 5s &middot; lente real dentro da moldura do Insta -->
      <a class="orbe orbe--nu orbe--instagram" href="https://www.instagram.com/kiq.ham" target="_blank" rel="noopener noreferrer"
         draggable="false" aria-label="Instagram" title="Instagram &middot; dois cliques para abrir">
        <span class="orbe__flutua">
        <span class="orbe__face">
          <span class="orbe__icone" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false" aria-hidden="true">
              <defs>
                <radialGradient id="ig-fundo" cx=".3" cy="1.06" r="1.3">
                  <stop offset="0" stop-color="#ffdd77"/>
                  <stop offset=".18" stop-color="#f9a03f"/>
                  <stop offset=".38" stop-color="#ed4956"/>
                  <stop offset=".6" stop-color="#d62976"/>
                  <stop offset=".82" stop-color="#962fbf"/>
                  <stop offset="1" stop-color="#4f5bd5"/>
                </radialGradient>
              </defs>
              <rect x="1" y="1" width="46" height="46" rx="13" fill="url(#ig-fundo)"/>
              <rect x="12.6" y="12.6" width="22.8" height="22.8" rx="7.2" fill="none" stroke="#ffffff" stroke-width="2.7"/>
              <circle cx="24" cy="24" r="6" fill="none" stroke="#ffffff" stroke-width="2.7"/>
              <circle cx="31.7" cy="16.3" r="1.75" fill="#ffffff"/>
              <path d="M11 5.2 Q24 2.2 37 5.2" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
        </span>
        </span>
      </a>
      <!-- 3. Behance &middot; 9s -->
      <a class="orbe orbe--nu orbe--behance" href="https://www.behance.net/okaiquemota" target="_blank" rel="noopener noreferrer"
         draggable="false" aria-label="Behance" title="Behance &middot; dois cliques para abrir">
        <span class="orbe__flutua">
        <span class="orbe__face">
          <span class="orbe__icone" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false" aria-hidden="true">
              <defs>
                <linearGradient id="be-azul" x1="0" y1="0" x2=".4" y2="1">
                  <stop offset="0" stop-color="#cdd8ff"/>
                  <stop offset=".4" stop-color="#6d8bff"/>
                  <stop offset="1" stop-color="#2b3f9e"/>
                </linearGradient>
                <linearGradient id="be-placa" x1="0" y1="0" x2=".3" y2="1">
                  <stop offset="0" stop-color="#171c2e"/>
                  <stop offset="1" stop-color="#080a13"/>
                </linearGradient>
              </defs>
              <rect x="1" y="1" width="46" height="46" rx="10" fill="url(#be-placa)" stroke="rgba(109,139,255,.32)"/>
              <text x="24" y="32.6" text-anchor="middle" font-size="24" font-weight="800" fill="#1d2650" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">B&#275;</text>
              <text x="24" y="31.4" text-anchor="middle" font-size="24" font-weight="800" fill="url(#be-azul)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">B&#275;</text>
              <path d="M11 7 Q24 3.5 37 7" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
        </span>
        </span>
      </a>
      <!-- 4. Passatempo &middot; 6s &middot; o card e o console &middot; gancho: data-abre="jogos" -->
      <button class="orbe orbe--passatempo" type="button" data-abre="jogos" aria-haspopup="dialog" aria-label="Passatempo" title="Passatempo &middot; dois cliques para abrir">
        <span class="orbe__flutua">
        <span class="orbe__face">
          <span class="orbe__icone" aria-hidden="true">

              <!-- a partida que roda na telinha: uma nave e dois invasores -->

                <rect x="29" y="30" width="6" height="4"/>
                <rect x="23" y="34" width="18" height="4"/>
                <rect x="19" y="38" width="26" height="4"/>
                <rect x="23" y="42" width="4" height="3"/>

              <g fill="rgba(94,242,255,.62)">
                <rect x="12" y="9" width="10" height="3"/>
                <rect x="9" y="12" width="16" height="3"/>
                <rect x="12" y="15" width="3" height="3"/>
                <rect x="19" y="15" width="3" height="3"/>
                <rect x="42" y="13" width="10" height="3"/>
                <rect x="39" y="16" width="16" height="3"/>
                <rect x="42" y="19" width="3" height="3"/>
                <rect x="49" y="19" width="3" height="3"/>
              </g>
              <g fill="rgba(255,255,255,.5)">
                <rect x="52" y="6" width="1.6" height="1.6"/>
                <rect x="7" y="24" width="1.6" height="1.6"/>
                <rect x="57" y="33" width="1.6" height="1.6"/>
              </g>

              <g fill="rgba(0,0,0,.28)"><rect y="0" width="64" height="1"/><rect y="3" width="64" height="1"/><rect y="6" width="64" height="1"/><rect y="9" width="64" height="1"/><rect y="12" width="64" height="1"/><rect y="15" width="64" height="1"/><rect y="18" width="64" height="1"/><rect y="21" width="64" height="1"/><rect y="24" width="64" height="1"/><rect y="27" width="64" height="1"/><rect y="30" width="64" height="1"/><rect y="33" width="64" height="1"/><rect y="36" width="64" height="1"/><rect y="39" width="64" height="1"/><rect y="42" width="64" height="1"/><rect y="45" width="64" height="1"/></g>
              <path d="M0 0 L22 0 L4 48 L0 48 Z" fill="rgba(255,255,255,.055)"/>
            </svg>
          </span>
        </span>
        </span>
      </button>
      <!-- 5. Mural &middot; 8s &middot; folha de fichario, nao vidro &middot; gancho: data-abre="mural" -->

        <span class="orbe__face">
          <span class="orbe__icone" aria-hidden="true">

              <ellipse cx="17" cy="18.4" rx="7.6" ry="3.1" fill="rgba(0,0,0,.35)"/>

            </svg>
          </span>
          <span class="orbe__texto">
            <span class="orbe__rotulo">Mural</span>
            <span class="orbe__meta">ideias soltas</span>
          </span>

        </span>

    </nav>
  </main>

  <!-- Fisica dos cards: deriva livre, colisao e arrasto.
       Vanilla, sem biblioteca. Nao toca nos [data-abre]: um toque
       sem arrasto continua disparando o click normalmente. -->

</html>
