<head>

  <!-- Playfair Display (nome) + Caveat (manuscrito do Mural).
       Se quiser voltar a zero dependencias externas, remova estas 3 linhas:
       o CSS ja cai para Georgia/cursive do sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Caveat:wght@500;600&display=swap">

<body>

  <!-- ============================================================
       O VACUO  (tudo aqui e decorativo e nao clicavel)
       ============================================================ -->
  <div class="cosmos" aria-hidden="true">
    <div class="ceu ceu--longe"></div>
    <div class="ceu ceu--meio"></div>
    <div class="ceu ceu--perto"></div>

    <div class="aro aro--um"></div>
    <div class="aro aro--dois"></div>
    <div class="aro aro--tres"></div>

         O emoji e so o ocupante do lugar. Para plugar seu PNG
         transparente, ponha um <img> dentro do span (o CSS ja
         dimensiona: .satelite img { width:100%; height:100% }). -->
    <span class="satelite sat--filme" data-satelite="filme">&#127902;&#65039;</span>
    <!-- trocar por PNG: <span class="satelite sat--filme" data-satelite="filme"><img src="img/filme.png" alt=""></span> -->
    <span class="satelite sat--clipe" data-satelite="clipe">&#128206;</span>
    <!-- trocar por PNG: <span class="satelite sat--clipe" data-satelite="clipe"><img src="img/clipe.png" alt=""></span> -->
    <span class="satelite sat--tampa" data-satelite="tampa-lente"><svg viewBox="0 0 32 32" focusable="false" aria-hidden="true">
        <defs>
          <linearGradient id="tp-corpo" x1=".2" y1="0" x2=".8" y2="1">
            <stop offset="0" stop-color="#3f4653"/>
            <stop offset=".45" stop-color="#1c212b"/>

        <circle cx="16" cy="16" r="10.5" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1.2"/>

        <path d="M8.5 8.5 A10.5 10.5 0 0 1 16 5.5" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.4" stroke-linecap="round"/>
      </svg></span>
    <!-- trocar por PNG: <span class="satelite sat--tampa" data-satelite="tampa-lente"><img src="img/tampa-lente.png" alt=""></span> -->
    <span class="satelite sat--cafe" data-satelite="cafe">&#9749;</span>
    <!-- trocar por PNG: <span class="satelite sat--cafe" data-satelite="cafe"><img src="img/cafe.png" alt=""></span> -->

    <div class="vinheta"></div>
  </div>
