<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="description" content="Portfólio de Kaique Mota — desenvolvedor e criativo.">
  <title>Kaique Mota — Portfólio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       FUNDO / PROFUNDIDADE  (puramente decorativo)
       ============================================================ -->
  <div class="cosmos" aria-hidden="true">
    <div class="nebulosa nebulosa--ciano"></div>
    <div class="nebulosa nebulosa--violeta"></div>

    <div class="ceu ceu--longe"></div>
    <div class="ceu ceu--meio"></div>
    <div class="ceu ceu--perto"></div>

    <div class="aro aro--um"></div>
    <div class="aro aro--dois"></div>
    <div class="aro aro--tres"></div>

    <div class="vinheta"></div>
  </div>

  <!-- ============================================================
       ESPAÇO PRINCIPAL
       ============================================================ -->
  <main class="espaco">

    <!-- ---------- O CENTRO ---------- -->
    <div class="nucleo">
      <p class="nucleo__tag">Portfólio</p>

      <h1 class="nome">
        <span class="nome__parte" data-texto="KAIQUE">KAIQUE</span>
        <span class="nome__parte nome__parte--dois" data-texto="MOTA">MOTA</span>
      </h1>

      <p class="nucleo__legenda">Desenvolvedor&nbsp;&amp;&nbsp;Criativo <span class="ponto"></span> Gravidade zero</p>
    </div>

    <!-- ---------- A ÓRBITA ---------- -->
    <nav class="orbita" aria-label="Links do portfólio">

      <!-- 1. GitHub  ·  6.8s -->
      <a class="orbe orbe--github" href="https://github.com/okaiquemota" target="_blank" rel="noopener noreferrer">
        <span class="orbe__face">
          <span class="orbe__icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23a11.5 11.5 0 0 1 3-.405c1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
            </svg>
          </span>
          <span class="orbe__texto">
            <span class="orbe__rotulo">GitHub</span>
            <span class="orbe__meta">Código aberto</span>
          </span>
        </span>
      </a>

      <!-- 2. Instagram  ·  5s -->
      <a class="orbe orbe--instagram" href="https://www.instagram.com/okaiquemota" target="_blank" rel="noopener noreferrer">
        <span class="orbe__face">
          <span class="orbe__icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <circle cx="12" cy="12" r="4.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <circle cx="17.4" cy="6.6" r="1.25" fill="currentColor"/>
            </svg>
          </span>
          <span class="orbe__texto">
            <span class="orbe__rotulo">Instagram</span>
            <span class="orbe__meta">Bastidores</span>
          </span>
        </span>
      </a>

      <!-- 3. Behance  ·  9s -->
      <a class="orbe orbe--behance" href="https://www.behance.net/okaiquemota" target="_blank" rel="noopener noreferrer">
        <span class="orbe__face">
          <span class="orbe__icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <text x="12" y="17.2" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor" font-family="inherit">Bē</text>
            </svg>
          </span>
          <span class="orbe__texto">
            <span class="orbe__rotulo">Behance</span>
            <span class="orbe__meta">Projetos</span>
          </span>
        </span>
      </a>

      <!-- 4. Passatempo  ·  6s  ·  gancho do modal: data-abre="jogos" -->
      <button class="orbe orbe--passatempo" type="button" data-abre="jogos" aria-haspopup="dialog">
        <span class="orbe__face">
          <span class="orbe__icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="2.4" y="7" width="19.2" height="10.6" rx="5.3" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M7 10.3v3.9M5.05 12.25h3.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <circle cx="16.1" cy="11.1" r="1.2" fill="currentColor"/>
              <circle cx="18.4" cy="13.6" r="1.2" fill="currentColor"/>
            </svg>
          </span>
          <span class="orbe__texto">
            <span class="orbe__rotulo">Passatempo</span>
            <span class="orbe__meta">Jogos</span>
          </span>
        </span>
      </button>

      <!-- 5. Mural  ·  8s  ·  gancho do modal: data-abre="mural" -->
      <button class="orbe orbe--mural" type="button" data-abre="mural" aria-haspopup="dialog">
        <span class="orbe__face">
          <span class="orbe__icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="3" y="3.6" width="18" height="16.8" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M3 9.2h18M9.6 9.2v11.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
            </svg>
          </span>
          <span class="orbe__texto">
            <span class="orbe__rotulo">Mural</span>
            <span class="orbe__meta">Ideias soltas</span>
          </span>
        </span>
      </button>

    </nav>
  </main>

  <!-- Os scripts de modal entram aqui depois, escutando [data-abre] -->
</body>
</html>
